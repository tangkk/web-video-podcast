name: Verify and import five official podcast channels

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: new-podcast-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Skip if five official video catalogs are already populated
        id: pending
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          // An incremental update is not proof of a complete historical scan.
          const done = fs.existsSync('scripts/new-podcasts-verified.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'needed=' + (!done) + String.fromCharCode(10));
          console.log(done ? 'All five shows have verified video entries.' : 'Full video verification pending.');
          NODE
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.needed == 'true'
        with:
          node-version: 22
      - name: Verify official video uploads and import embeddable full episodes
        if: steps.pending.outputs.needed == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$YOUTUBE_API_KEY"
          node --check scripts/sync-youtube.mjs
          node scripts/validate-catalog.mjs
          node scripts/sync-youtube.mjs --backfill --show=joe-rogan,theo-von,shawn-ryan,all-in-podcast,broken-record --strict-sources
          node scripts/validate-catalog.mjs
      - name: Independently check all five show collections
        if: steps.pending.outputs.needed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const episodes = JSON.parse(fs.readFileSync('episodes.json', 'utf8')).episodes;
          const sources = ['joe-rogan','theo-von','shawn-ryan','all-in-podcast','broken-record'];
          const report = JSON.parse(fs.readFileSync('scripts/backfill-report.json','utf8'));
          if (report.totals.sources !== 5 || report.totals.checked !== 5 || report.totals.failed !== 0)
            throw new Error('Full five-channel API scan did not complete');
          const result = {};
          for (const id of sources) {
            const found = episodes.filter(e => e.showId === id);
            const scanned = report.sources.find(x => x.showId === id);
            if (!scanned || scanned.status !== 'ok' || scanned.eligible < 1 || found.length < 1)
              throw new Error('No verified full episodes after backfill: '+id);
            if (found.some(e => !/^[A-Za-z0-9_-]{11}$/.test(e.youtube) || !e.publishedAt || !(e.duration > 0)))
              throw new Error('Invalid episode metadata: '+id);
            result[id] = {scanned:scanned.scanned, eligible:scanned.eligible, episodes:found.length};
            console.log(id+': '+found.length+' valid YouTube episodes');
          }
          fs.writeFileSync('scripts/new-podcasts-verified.json', JSON.stringify({
            verifiedAt:new Date().toISOString(), shows:result,
            policy:'Full channel uploads scanned; public, embeddable, length and title filters validated by YouTube Data API v3'
          }, null, 2)+String.fromCharCode(10));
          NODE
      - name: Commit verified episodes with safe remote reconciliation
        if: steps.pending.outputs.needed == 'true'
        run: |
          git add episodes.json scripts/new-podcasts-verified.json
          if git diff --cached --quiet; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import verified official video episodes for five new podcasts'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Validated videos published to main.'
              exit 0
            fi
          done
          exit 1
