name: Verify and backfill video podcast archives

on:
  push:
    branches: [feature/full-youtube-archive]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-archive-feature
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and catalog
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < sync.js
          node --check scripts/sync-youtube.mjs
          node scripts/validate-catalog.mjs
      - name: Full historical backfill (feature branch only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/full-youtube-archive'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY secret is missing"
            exit 1
          fi
          node scripts/sync-youtube.mjs --backfill
          node scripts/validate-catalog.mjs
      - name: Commit validated archive once
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/full-youtube-archive'
        run: |
          git add episodes.json scripts/backfill-report.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Backfill complete YouTube video podcast archive [skip ci]'
            git push origin HEAD:feature/full-youtube-archive
          fi
