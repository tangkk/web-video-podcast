name: Complete video podcast archive rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-video-archive.yml'
  schedule:
    # YouTube API daily quota resets at midnight US Pacific; wait at least one hour.
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: video-archive-rollout
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check whether complete archive already exists
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only an independently validated complete archive marker should disable retries.
          if gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/full-archive-verified.json?ref=main" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pending.outputs.needed == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.needed == 'true'
        with:
          node-version: 22
      - name: Backfill all configured YouTube channels
        if: steps.pending.outputs.needed == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          test -n "$YOUTUBE_API_KEY"
          node --input-type=module --check < app.js
          node --input-type=module --check < sync.js
          node --check scripts/sync-youtube.mjs
          node scripts/sync-youtube.mjs --backfill 2>&1 | tee backfill-run.log
          node scripts/validate-catalog.mjs
          rm -f scripts/backfill-failure.md
      - name: Strictly verify backfill coverage
        if: steps.pending.outputs.needed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('catalog.json'));
          const data = JSON.parse(fs.readFileSync('episodes.json'));
          const report = JSON.parse(fs.readFileSync('scripts/backfill-report.json'));
          const latest = new Map();
          for (const video of data.episodes) latest.set(video.showId, (latest.get(video.showId) ?? 0) + 1);
          const replacements = ['npr-newsmakers', 'dashu-mandarin', 'rest-is-politics', 'rest-is-politics-us', 'one-night-talk', 'outcasts-853', 'manki-cantonese-podcast','joe-rogan','theo-von','shawn-ryan','all-in-podcast','broken-record','kill-tony','flagrant','rick-beato-interviews','h3-podcast','club-random'];
          if (catalog.shows.length !== 60 || report.totals.sources !== catalog.shows.length || report.totals.checked !== catalog.shows.length || report.totals.failed !== 0) {
            throw new Error('Not all 60 channels completed successfully: ' + JSON.stringify(report.totals));
          }
          if (data.episodes.length < 10000) throw new Error('Archive incomplete: only ' + data.episodes.length + ' episodes');
          for (const id of replacements) {
            if (!latest.get(id)) throw new Error('Replacement show has no embeddable episode: ' + id);
          }
          if (data.episodes.some(e => !e.youtube)) throw new Error('An external-only episode remains');
          console.log('Verified', data.episodes.length, 'episodes in', catalog.shows.length, 'shows.');
          for (const id of replacements) console.log(id + ': ' + latest.get(id));
          NODE
      - name: Write durable full-archive completion marker
        if: steps.pending.outputs.needed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('scripts/backfill-report.json','utf8'));
          fs.writeFileSync('scripts/full-archive-verified.json',JSON.stringify({
            verifiedAt:new Date().toISOString(),sources:report.totals.sources,
            checked:report.totals.checked,failed:report.totals.failed,
            episodes:report.totals.episodes
          },null,2)+String.fromCharCode(10));
          NODE
      - name: Save complete archive on main
        if: steps.pending.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- episodes.json scripts/
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified complete video podcast archive [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
      - name: Deploy verified archive to GitHub Pages
        if: steps.pending.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run video-pages.yml --ref main -f deploy_only=true
      - name: Upload diagnostic logs if unsuccessful
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-rollout-failure-logs
          path: backfill-run.log
          if-no-files-found: ignore
