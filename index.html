<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="搜尋並觀看英語、國語與粵語的完整影片播客。">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Web Video Podcasts</title>
  <link rel="icon" href="./favicon.svg?v=6" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=7">
  <script src="./app.js?v=6" type="module"></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <a class="brand" href="#" aria-label="Web Video Podcasts 首頁"><span class="brand-icon" aria-hidden="true">▶</span> WEB VIDEO PODCASTS</a>
      <h1>Web Video Podcasts<span>.</span></h1>
      <p>完整單集，隨時開看。探索英語、國語與粵語的影片播客。</p>
      <button id="sync-toggle" class="pill" type="button" aria-haspopup="dialog">同步</button>
    </header>
    <section class="toolbar" aria-label="搜尋與篩選">
      <label class="search">
        <span class="sr-only">搜尋節目、單集或主題</span>
        <input id="search" type="search" placeholder="搜尋節目、單集或主題" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="filter-group"><span>語言</span><div id="languages" class="chips" role="group" aria-label="語言"></div></div>
      <div class="filter-group"><span>主題</span><div id="topics" class="chips" role="group" aria-label="主題"></div></div>
    </section>
    <section id="continue" class="continue" aria-labelledby="continue-title" hidden>
      <h2 id="continue-title">繼續看</h2>
      <div id="recent" class="recent"></div>
    </section>
    <section id="browse">
      <div class="viewbar">
        <div class="tabs" role="group" aria-label="顯示內容">
          <button class="tab" data-view="episodes" aria-pressed="true" type="button">最新單集</button>
          <button class="tab" data-view="shows" aria-pressed="false" type="button">全部節目</button>
        </div>
        <button id="favorites" class="pill" type="button" aria-pressed="false"><span aria-hidden="true">☆</span> 只看收藏</button>
      </div>
      <div class="summary" aria-live="polite" id="summary">正在載入目錄…</div>
      <div class="directory" id="directory"></div>
    </section>
    <section id="detail" hidden></section>
    <footer><span>Web Video Podcasts</span><span id="footer-count"></span></footer>
  </main>

  <dialog id="watch" aria-labelledby="watch-title">
    <div class="watch-top">
      <span class="watch-show" id="watch-show"></span>
      <button id="close-watch" class="icon" type="button" aria-label="關閉播放器" autofocus>×</button>
    </div>
    <div id="screen" class="screen"></div>
    <div class="watch-info">
      <h2 id="watch-title"></h2>
      <p id="watch-published" class="watch-published"></p>
      <div class="watch-seek-controls" role="group" aria-label="播放進度控制">
        <button type="button" class="pill" data-seek-relative="-10" aria-keyshortcuts="ArrowLeft">← 後退 10 秒</button>
        <button type="button" class="pill" data-seek-relative="10" aria-keyshortcuts="ArrowRight">前進 10 秒 →</button>
      </div>
      <p id="watch-state" role="status"></p>
      <div id="chapters" class="chapters" hidden></div>
      <a id="source" class="pill" target="_blank" rel="noopener noreferrer">在原平台觀看</a>
    </div>
  </dialog>
  <dialog id="sync-panel" aria-labelledby="sync-title">
    <header class="watch-top">
      <h2 id="sync-title">多裝置同步</h2>
      <button id="sync-close" class="icon" type="button" aria-label="關閉同步設定">×</button>
    </header>
    <form class="sync-body">
      <p>在其他裝置輸入同一組同步碼，即可合併收藏與觀看進度。</p>
      <label for="sync-key">同步碼</label>
      <input id="sync-key" name="sync-key" type="text" maxlength="256" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus>
      <div class="sync-actions">
        <button id="sync-generate" class="pill" type="button">產生同步碼</button>
        <button id="sync-copy" class="pill" type="button">複製同步碼</button>
      </div>
      <div class="sync-actions">
        <button class="pill primary" type="submit">儲存並同步</button>
        <button id="sync-now" class="pill" type="button">立即同步</button>
        <button id="sync-disconnect" class="pill" type="button">中斷同步</button>
      </div>
      <p id="sync-status" role="status"></p>
    </form>
  </dialog>
</body>
</html>
